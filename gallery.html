<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Drawings - Suzuran</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=VT323&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <div class="band" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="logo" href="index.html"><span class="logo__arrow">&gt;</span> SUZURAN<span class="cursor">_</span></a>
      <nav class="nav" aria-label="Main">
        <a href="stories.html">[ STORIES ]</a>
        <a href="gallery.html" aria-current="page">[ DRAWINGS ]</a>
      </nav>
    </div>
  </header>

  <main class="wrap">

    <div class="page-title">
      <div class="prompt"><span class="hl-purple">suzuran@burrow</span>:<span class="hl-red">~</span>$ cd Pictures/Drawings</div>
      <div class="prompt"><span class="hl-purple">suzuran@burrow</span>:<span class="hl-red">~/Pictures/Drawings</span>$ ls</div>
      # pls work bro
      <h1>DRAWINGS</h1>
      <p class="lead">// <span id="count">...</span> drawings. click one to see it big.</p>
      <img class="divider" src="images/divider.svg" alt="">
    </div>

    <!--
      Everything below is built by js/gallery.js from drawings/drawings.json.
      To add pictures, upload them to the drawings/ folder on GitHub.
      To tag or describe them, edit drawings/info.txt. See README.md.
    -->
    <div class="filters" id="filters" aria-label="Filter by tag"></div>
    <div class="gallery" id="gallery"></div>
    <noscript><p class="muted">// the gallery needs JavaScript turned on.</p></noscript>

  </main>

  <!-- The big viewer. js/gallery.js fills it in and opens it. -->
  <dialog class="window viewer" id="viewer" aria-labelledby="viewerTitle">
    <div class="window__bar">
      <span class="viewer__title"><span id="viewerTitle"></span> &mdash; <span id="viewerCount"></span></span>
      <button class="viewer__close" id="viewerClose" type="button" aria-label="Close">[ X ]</button>
    </div>
    <div class="viewer__stage">
      <img id="viewerImg" alt="">
      <button class="viewer__cover" id="viewerCover" type="button" hidden>[ NSFW ]<br>click to show</button>
    </div>
    <div class="viewer__controls">
      <button class="btn" id="viewerPrev" type="button">[ &lt;&lt; PREV ]</button>
      <a class="viewer__original" id="viewerOriginal" href="#" target="_blank" rel="noopener">[ original file ]</a>
      <button class="btn" id="viewerNext" type="button">[ NEXT &gt;&gt; ]</button>
    </div>
  </dialog>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <div class="rabbit-area">
        <button class="rabbit" id="rabbit" type="button" aria-label="Poke the rabbit"
                data-lines="MANKIND IS DEAD.|BLOOD IS FUEL.|HELL IS FULL.|VIOLENCE!!!"><span class="rabbit__art">(\(\
( -.-)
o_(")(")</span></button>
        <div class="speech" id="speech" hidden><span class="hl-red">&lt;</span> <span id="speechText"></span></div>
      </div>
      <!-- The line below changes every few seconds (js/main.js) -->
      <div class="fineprint">// <span id="status">digging burrow...</span></div>
    </div>
  </footer>

  <div class="band" aria-hidden="true"></div>

  <script src="js/main.js?v=4"></script>
  <script src="js/gallery.js?v=4"></script>
</body>
</html>
