      <p class="lead">// nothing here yet. the drawings are still being drawn.</p>
      <img class="divider" src="images/divider.svg" alt="">
    </div>

    <!--
      To add a drawing: copy one <figure> block.
      Replace the placeholder text with an image, for example:
        <div class="tile__art"><img src="images/art_01.jpg" alt="what the drawing shows"></div>
      Then delete the style="--h: ..." part, because a real image sets its own height.
      Use class "tile tile--red" for a red frame, or just "tile" for purple.
    -->
    <div class="gallery">
      <figure class="tile" style="--h: 360px">
        <figcaption class="tile__bar">art_01.png</figcaption>
        <div class="tile__art slot">[ drawing ]</div>
      </figure>
      <figure class="tile tile--red" style="--h: 280px">
        <figcaption class="tile__bar">art_02.png</figcaption>
        <div class="tile__art slot">[ drawing ]</div>
      </figure>
      <figure class="tile" style="--h: 340px">
        <figcaption class="tile__bar">art_03.png</figcaption>
        <div class="tile__art slot">[ drawing ]</div>
      </figure>
      <figure class="tile tile--red" style="--h: 300px">

        <div class="tile__art slot">[ drawing ]</div>
      </figure>
      <figure class="tile" style="--h: 380px">
        <figcaption class="tile__bar">art_05.png</figcaption>
        <div class="tile__art slot">[ drawing ]</div>
      </figure>
      <figure class="tile tile--red" style="--h: 320px">

      </figure>
      <figure class="tile" style="--h: 320px">

      <figure class="tile tile--red" style="--h: 300px">

      <figure class="tile" style="--h: 330px">

    </div>
